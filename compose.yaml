x-app: &app
  build: .
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: eon_observation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eon}"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-eon}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
  minio_setup:
    image: minio/mc:latest
    env_file: .env
    entrypoint: /bin/sh
    command: -c 'until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing "local/$$S3_BUCKET"'
    depends_on:
      - minio
  observation:
    <<: *app
    environment:
      SERVICE_NAME: observation
    ports:
      - '8001:8000'
  image_processing:
    <<: *app
    environment:
      SERVICE_NAME: image_processing
    ports:
      - '8002:8000'
  spectral:
    <<: *app
    environment:
      SERVICE_NAME: spectral
    ports:
      - '8003:8000'
  jobs:
    <<: *app
    environment:
      SERVICE_NAME: jobs
    ports:
      - '8004:8000'
  observation_worker:
    <<: *app
    environment:
      SERVICE_NAME: observation
    command: celery -A eon_common.celery worker --concurrency=1 --loglevel=INFO
  image_worker:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio_setup:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: image_processing
    command: celery -A eon_common.celery worker -Q image_processing --concurrency=2 --loglevel=INFO
  observation_beat:
    <<: *app
    environment:
      SERVICE_NAME: observation
    command: celery -A eon_common.celery beat --loglevel=INFO

volumes:
  pgdata:
  redisdata:
  miniodata:
