[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eon-spherex-backend"
version = "0.1.0"
description = "SPHEREx Sky Explorer backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<6.1", "djangorestframework>=3.16,<4", "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6",
  "astropy>=7,<9", "astroquery>=0.4.10,<1", "numpy>=2,<3", "pyvo>=1.7,<2",
  "hpgeom>=1.4,<2", "Pillow>=11,<14",
  "boto3>=1.38,<2", "requests>=2.32,<3", "python-json-logger>=3,<5", "gunicorn>=23,<26"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["eon_common*", "services*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "eon_common.settings"
python_files = ["test_*.py"]
markers = ["integration: live IRSA and S3 integration tests"]

[tool.ruff]
line-length = 100
